# End-to-end test of the AutoBrief demo kit (demo/) on a GitHub-hosted Linux runner.
#
# It boots the official Pleos Connect v2.1.0 emulator headless (hardware-accelerated with KVM),
# installs the debug APK, loads the demo sample, plays the three driving scenarios through the
# Vehicle Virtual Console and verifies the app's logcat (TRIP_CLOSED per scenario).
#
# NOTE: pushing or editing a file under .github/workflows/ needs a token with the `workflow`
# scope. A token without it is rejected by GitHub with "refusing to allow ... to create or
# update workflow ... without `workflow` scope".
#
# Needs in the repository: demo/, app/ (Gradle project) and tools/fleet-console/fleet_console.py
# (the webhook receiver the demo sample posts to, reached from the emulator as 10.0.2.2:8787).

name: emulator-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "demo/**"
      - ".github/workflows/emulator-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONUNBUFFERED: "1" # stream the download/boot progress into the log as it happens
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space (never the Android SDK)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:?}/CodeQL"
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # the udev rule does not always take effect in time on newer images; set the mode directly as well
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          # without KVM the image boots only to a black screen (the car service never starts), so stop early
          test -r /dev/kvm && test -w /dev/kvm || { echo "no usable /dev/kvm on this runner"; exit 1; }

      - name: Show runner resources
        run: |
          nproc
          free -g
          df -h
          ls -l /dev/kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install the Android emulator and platform-tools
        # The default step shell has no pipefail, so `yes` getting SIGPIPE does not fail the step;
        # the exit status is sdkmanager's.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Cache the Pleos system image zip
        uses: actions/cache@v4
        with:
          path: ~/.cache/autobrief-pleos
          key: pleos-x86_64-b4f858d5bcc6c71506d7edfc872bcb9e5a11acaa

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Start the fleet console
        # Output goes to a file: a background process that keeps the step's stdout open can make
        # the step wait for it.
        run: |
          mkdir -p /tmp/fleet
          nohup python3 tools/fleet-console/fleet_console.py --port 8787 --data /tmp/fleet > /tmp/fleet-console.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/state > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the fleet console did not answer on :8787" >&2
          cat /tmp/fleet-console.log >&2
          exit 1

      - name: Start the logcat capture
        # From before the emulator exists to the end of the job, so the boot, the user switch and the
        # setup stay on record even though setup and director clear the device's logcat ring.
        # adb wait-for-device starts the adb server; each loop reattaches if the device drops off.
        run: |
          mkdir -p e2e-out
          setsid nohup bash -c 'while true; do adb wait-for-device logcat -v time; sleep 1; done' \
            > e2e-out/logcat-all.txt 2>&1 < /dev/null &
          echo $! > /tmp/logcat-all.pid
          setsid nohup bash -c 'while true; do adb wait-for-device logcat -v time -s AutoBriefLog:V AutoBriefVehicle:V AutoBriefNavi:V ActivityManager:I ActivityTaskManager:I; sleep 1; done' \
            > e2e-out/logcat-autobrief.txt 2>&1 < /dev/null &
          echo $! > /tmp/logcat-autobrief.pid

      - name: Boot the emulator and install the app
        run: >
          python3 demo/setup_emulator.py --headless --no-browser
          --apk app/build/outputs/apk/debug/app-debug.apk
          --demo-sample --webhook http://10.0.2.2:8787/hook
          --out e2e-out

      - name: Start screen recording
        # 1280x720: the emulator display is 2560x1440, above what the software encoder accepts.
        # screenrecord stops after 180 s at most, and the director can run longer (it waits for the
        # app to see each place), so segments follow one another until the collect step stops them.
        run: |
          mkdir -p e2e-out
          rm -f /tmp/stop-recording
          nohup bash -c 'for i in 1 2 3 4; do adb shell screenrecord --size 1280x720 --time-limit 180 /sdcard/e2e-$i.mp4; [ -f /tmp/stop-recording ] && break; done' \
            > e2e-out/screenrecord.log 2>&1 < /dev/null &

      - name: Play the scenarios and verify
        run: python3 demo/director.py --scenario all --mode auto --fast --verify --out e2e-out

      - name: Collect the recording, logcat and fleet state
        if: always()
        # Best effort: when an earlier step failed the emulator or the console may not exist.
        run: |
          mkdir -p e2e-out
          touch /tmp/stop-recording
          adb shell pkill -SIGINT screenrecord || echo "screenrecord was not running"
          sleep 3
          for i in 1 2 3 4; do
            adb pull "/sdcard/e2e-$i.mp4" "e2e-out/e2e-$i.mp4" 2>/dev/null || break
          done
          ls e2e-out/e2e-*.mp4 > /dev/null 2>&1 || echo "no screen recording to pull"
          if ! command -v ffmpeg > /dev/null; then
            echo "no ffmpeg on this runner: the segments e2e-1.mp4, e2e-2.mp4, ... are kept as they are"
          elif ls e2e-out/e2e-*.mp4 > /dev/null 2>&1; then
            for f in e2e-out/e2e-*.mp4; do echo "file '$PWD/$f'"; done > /tmp/segments.txt
            ffmpeg -loglevel error -f concat -safe 0 -i /tmp/segments.txt -c copy e2e-out/e2e.mp4 || echo "segments kept as they are"
          fi
          adb logcat -d > e2e-out/logcat.txt || echo "no logcat to dump"
          {
            echo "## am get-current-user"; adb shell am get-current-user
            echo "## dumpsys activity activities (resumed)"; adb shell dumpsys activity activities | grep -E "ResumedActivity|topResumed"
            echo "## app processes (user is in the uid column)"; adb shell ps -A -o USER,PID,NAME | grep -E "autobrief|vehicle" || true
            echo "## dumpsys activity services app.autobrief.car"; adb shell dumpsys activity services app.autobrief.car | head -40
            echo "## dumpsys user"; adb shell dumpsys user | grep -E "UserInfo|State:|urrent"
            echo "## console /vehicle/state"; curl -s http://127.0.0.1:8088/vehicle/state; echo
          } > e2e-out/device-state-end.txt 2>&1 || echo "device state incomplete"
          curl -s http://127.0.0.1:8787/api/state > e2e-out/fleet_state.json || echo "no fleet state"
          cp /tmp/fleet-console.log e2e-out/fleet-console.log || echo "no fleet console log"
          for name in logcat-all logcat-autobrief; do
            if [ -f "/tmp/$name.pid" ]; then kill -- "-$(cat "/tmp/$name.pid")" 2>/dev/null || true; fi
          done

      - name: Keep a bug report after a failure
        if: failure()
        # An ANR's VM traces (every thread's stack when Android declared it) stay on the device: /data/anr is not
        # readable on this user build, but the bug report carries it (FS/data/anr/*) with the CPU and event log of that
        # moment. The zip is kept as it is; the traces are also unpacked so they can be read without it.
        run: |
          timeout 300 adb bugreport /tmp/bugreport.zip > e2e-out/bugreport.log 2>&1 || echo "bug report incomplete, see bugreport.log"
          if [ -f /tmp/bugreport.zip ]; then
            cp /tmp/bugreport.zip e2e-out/bugreport.zip
            python3 - e2e-out/bugreport.zip e2e-out/anr-traces <<'PY'
          import os, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = [n for n in z.namelist() if n.startswith("FS/data/anr/") and not n.endswith("/")]
          os.makedirs(sys.argv[2], exist_ok=True)
          for n in names:
              with open(os.path.join(sys.argv[2], os.path.basename(n)), "wb") as out:
                  out.write(z.read(n))
          print("ANR traces:", len(names), [os.path.basename(n) for n in names])
          PY
            du -h e2e-out/bugreport.zip
          fi

      - name: Upload e2e-out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e-out
          retention-days: 14
          if-no-files-found: warn
