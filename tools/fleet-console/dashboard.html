<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오토브리프 관리자 화면</title>
<style>
/* Pretendard (SIL OFL 1.1) from the app's own bundle, served by fleet_console.py */
@font-face{font-family:Pretendard;src:url(/fonts/Pretendard-Regular.ttf) format('truetype');font-weight:100 500;font-display:swap}
@font-face{font-family:Pretendard;src:url(/fonts/Pretendard-Bold.ttf) format('truetype');font-weight:600 900;font-display:swap}
/* purpose colours = the app's night palette (ui/Theme.kt) */
:root{--bg:#0A0C10;--panel:#11151C;--text:#F2F5F9;--muted:#9AA6B8;--accent:#66ADFF;--commute:#70B5FF;--business:#3CC9B0;
  --personal:#DDA77B;--pending:#F4A93B;--gap:#A3B1C6;--ok:#4FD685;--danger:#F88078;--line:#252E3D;--inset:#181E27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:22px 40px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:30px;letter-spacing:-0.02em}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
#conn{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;padding:6px 14px;background:var(--inset);border:1px solid var(--line);border-radius:6px}
#conn.off{color:var(--danger);border-color:rgba(248,128,120,.55);font-weight:700}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,860px),1fr));gap:24px;padding:24px 40px 48px}
.empty{grid-column:1/-1;padding:90px 20px;text-align:center;color:var(--muted);background:var(--panel);
  border:1px dashed var(--line);border-radius:12px;font-size:20px}
.car{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.plate{font-size:28px;font-weight:700;letter-spacing:-0.01em}
.meta{color:var(--muted)}
.chain{display:flex;align-items:center;gap:10px}
.code{color:var(--muted);font-variant-numeric:tabular-nums;padding:4px 10px;background:var(--inset);border:1px solid var(--line);border-radius:6px}
.badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:16px;font-weight:700;border:1px solid;border-left-width:3px}
.badge.small{padding:2px 9px;font-size:15px}
.badge+.badge{margin-left:6px}
.badge.ok{color:var(--ok);background:rgba(79,214,133,.14);border-color:rgba(79,214,133,.45);border-left-color:var(--ok)}
.badge.warn{color:var(--pending);background:rgba(244,169,59,.14);border-color:rgba(244,169,59,.45);border-left-color:var(--pending)}
.badge.bad{color:var(--danger);background:rgba(248,128,120,.16);border-color:rgba(248,128,120,.55);border-left-color:var(--danger)}
.band{display:flex;flex-wrap:wrap;align-items:center;gap:24px;margin:18px 0 6px}
.ratio .big{font-size:64px;font-weight:800;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.lbl{color:var(--muted);font-size:14px;word-break:keep-all}
.stats{flex:1;min-width:280px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;margin-top:2px;font-size:22px;font-variant-numeric:tabular-nums}
.sect{margin:22px 0 8px;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:0.01em}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;min-width:800px;border-collapse:collapse;font-size:16px}
th,td{padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.multi table{min-width:760px;font-size:14px}.multi th,.multi td{padding:9px 10px}   /* two cars side by side at 1920 */
th{background:var(--inset);color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 10px;border-radius:6px;font-size:15px;font-weight:700;border:1px solid;border-left-width:3px}
.chip.commute{color:var(--commute);background:rgba(112,181,255,.15);border-color:rgba(112,181,255,.45);border-left-color:var(--commute)}
.chip.business{color:var(--business);background:rgba(60,201,176,.15);border-color:rgba(60,201,176,.45);border-left-color:var(--business)}
.chip.personal{color:var(--personal);background:rgba(221,167,123,.15);border-color:rgba(221,167,123,.45);border-left-color:var(--personal)}
.chip.pending{color:var(--pending);background:rgba(244,169,59,.15);border-color:rgba(244,169,59,.45);border-left-color:var(--pending)}
.chip.gap{color:var(--gap);background:rgba(163,177,198,.15);border-color:rgba(163,177,198,.45);border-left-color:var(--gap)}
.tag{margin-left:6px;padding:1px 7px;border:1px solid rgba(244,169,59,.55);background:rgba(244,169,59,.12);border-radius:5px;color:var(--pending);font-size:15px}
.tag.family{border-color:rgba(221,167,123,.55);background:rgba(221,167,123,.12);color:var(--personal)}
.fuel{margin:8px 0 0;padding:10px 14px;background:var(--inset);border:1px solid var(--line);border-left:3px solid var(--business);border-radius:8px;font-size:19px;font-weight:700}
small{margin-left:6px;color:var(--muted)}
.none{padding:18px;color:var(--muted)}
.files{display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--inset);border:1px solid var(--line);border-radius:10px}
.files a{color:var(--commute);font-weight:700;text-decoration:none}.files a:hover{text-decoration:underline}
/* alerts: a banner above the numbers, red when anything was tampered with */
.banner{margin:18px 0 4px;padding:14px 20px;border-radius:10px;border:1px solid var(--line);border-left-width:4px;background:var(--inset);font-size:21px;line-height:1.45}
.banner.warn{border-color:rgba(244,169,59,.55);border-left-color:var(--pending);background:#241D12}
.banner.bad{border-color:rgba(248,128,120,.6);border-left-color:var(--danger);background:#2B1418}
.banner .title{font-size:23px;font-weight:800}
.banner.warn .title{color:var(--pending)}.banner.bad .title{color:var(--danger)}
.banner ul{margin:6px 0 0;padding:0;list-style:none}
.banner li{padding:2px 0}
.banner li.bad::before{content:'▍ ';color:var(--danger)}.banner li.warn::before{content:'▍ ';color:var(--pending)}
.banner li.info::before{content:'▍ ';color:var(--muted)}
tr.tampered td{background:rgba(255,107,107,.14)}
tr.tampered td:first-child{box-shadow:inset 5px 0 0 var(--danger)}
@keyframes flash{from{background:rgba(255,181,71,.5)}to{background:transparent}}
@keyframes flashbad{from{background:rgba(255,107,107,.6)}to{background:rgba(255,107,107,.14)}}
tr.flash td{animation:flash 4s ease-out var(--d,0s) both}
tr.tampered.flash td{animation-name:flashbad}   /* the fade ends on the tamper tint, not transparent */
@media (max-width:1100px){
  header{padding:22px 20px 6px}
  main{padding:12px 20px 36px}
  .car{padding:18px}
  .banner{padding:12px 16px;font-size:18px;word-break:keep-all}
  .banner .title{font-size:21px}
  table{min-width:0;font-size:15px}
  th,td{padding:8px 8px}
  .badge.small,.chip,.tag{font-size:14px;padding:2px 8px}
}
@media (max-width:700px){
  header{padding:18px 14px 4px}h1{font-size:24px}
  main{padding:12px 14px 32px;gap:16px}
  .car{padding:16px}.plate{font-size:22px}
  .ratio .big{font-size:48px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>오토브리프 관리자 화면</h1>
    <p class="sub">차에서 기록되는 순간 회사 서버에도 사본이 남습니다 (가상 예시 시연용)</p>
  </div>
  <div id="conn">연결 중…</div>
</header>
<main id="fleet"></main>
<script>
(function () {
  'use strict';
  var POLL_MS = 2000, FLASH_MS = 4000;
  var BADGE = {'정상': 'ok', '누락 있음': 'warn', '변조 의심': 'bad'};
  var CHIP = {COMMUTE: 'commute', BUSINESS: 'business', PERSONAL: 'personal', UNCLASSIFIED: 'pending', UNLOGGED_GAP: 'gap'};
  var EMPTY = '아직 받은 기록이 없습니다. 차에서 시동을 걸고 P로 돌아오면 여기에 나타납니다.';
  var HEAD = ['날짜', '시간', '계기판 (전→후)', '거리', '목적', '사용자', '분류 방식', '상태'];
  var lastJson = '', busy = false, born = {}, seen = {}, firstRender = true, scrolls = {};

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function km(n) { return n === null || n === undefined ? '-' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: 1}); }
  function pct(n) { return n === null || n === undefined ? '-' : n + '%'; }

  // rows a rejected change targeted: the server names them on the alert (tripId)
  function tamperedTrips(car) {
    var out = {};
    car.alerts.forEach(function (a) { if (a.level === 'bad' && a.tripId) out[a.tripId] = true; });
    return out;
  }

  function tripRow(car, t, now, known, tampered) {
    var hit = !!tampered[t.id];
    var sig = [car.key, t.id, t.purpose, t.amended, t.status, hit].join('|');
    known[sig] = true;
    if (!firstRender && !seen[sig] && !born[sig]) born[sig] = now;   // absent from the previous render: new or changed
    var tr = el('tr'), age = now - (born[sig] || 0);
    if (hit) tr.className = 'tampered';
    if (born[sig] && age < FLASH_MS) {
      tr.className = (tr.className + ' flash').trim();
      tr.style.setProperty('--d', '-' + age + 'ms');            // resume the 4 s fade where it was
    }
    var cells = [t.date, t.time, km(t.startOdometerKm) + ' → ' + km(t.endOdometerKm), km(t.distanceKm) + ' km'];
    cells.forEach(function (c, i) { tr.appendChild(el('td', i === 3 ? 'num' : '', c)); });
    var purpose = el('td');
    purpose.appendChild(el('span', 'chip ' + (CHIP[t.purpose] || 'pending'), t.purposeLabel));
    tr.appendChild(purpose);
    tr.appendChild(el('td', '', t.user || '-'));
    var how = el('td', '', t.family ? '' : (t.by || '-'));
    if (t.family) how.appendChild(el('span', 'tag family', '가족 운행 (위치 기록 안 함)'));   // no location was read for it
    if (t.autoReason) how.appendChild(el('small', '', t.autoReason));
    if (t.amended) {
      var tag = el('span', 'tag', '수정됨');
      if (t.amendReason) tag.title = t.amendReason;
      how.appendChild(tag);
    }
    tr.appendChild(how);
    var status = el('td');
    status.appendChild(el('span', 'badge small ' + (BADGE[t.status] || 'warn'), t.status));
    if (hit) status.appendChild(el('span', 'badge small bad', '변조 시도'));
    tr.appendChild(status);
    return tr;
  }

  function banner(car) {
    var level = car.alerts.some(function (a) { return a.level === 'bad'; }) ? 'bad'
      : (car.alerts.some(function (a) { return a.level === 'warn'; }) ? 'warn' : 'info');
    var box = el('div', 'banner ' + level), list = el('ul'), when = {};
    car.recentTrips.forEach(function (t) { when[t.id] = t.date + ' ' + t.time; });
    box.setAttribute('role', level === 'info' ? 'status' : 'alert');
    var attempt = car.alerts.some(function (a) { return a.level === 'bad' && a.tripId; });
    box.appendChild(el('div', 'title', level === 'bad'
      ? (attempt ? '변조 시도를 막았습니다 · 회사 사본은 처음 받은 기록 그대로입니다' : '변조가 의심되는 기록이 있습니다')
      : (level === 'warn' ? '받지 못한 기록이 있습니다' : '알림')));
    car.alerts.forEach(function (a) {
      list.appendChild(el('li', a.level, a.text + (a.tripId && when[a.tripId] ? ' · ' + when[a.tripId] + ' 운행' : '')));
    });
    box.appendChild(list);
    return box;
  }

  function carView(car, now, known) {
    var sec = el('section', 'car'), head = el('div', 'head'), id = el('div');
    id.appendChild(el('div', 'plate', car.plate || car.key));
    if (car.label) id.appendChild(el('span', 'badge small warn', car.label)); // 시연: a copy from the app's demo space
    id.appendChild(el('div', 'meta', [car.model, car.entity].filter(Boolean).join(' · ')));
    var chain = el('div', 'chain');
    chain.appendChild(el('span', 'badge ' + (BADGE[car.chainStatus] || 'warn'), car.chainStatus));
    chain.appendChild(el('span', 'code', '검증 코드 ' + (car.lastHashShort || '-')));
    head.appendChild(id);
    head.appendChild(chain);
    sec.appendChild(head);
    if (car.alerts.length) sec.appendChild(banner(car));

    var m = car.month, y = car.year, band = el('div', 'band'), ratio = el('div', 'ratio');
    ratio.appendChild(el('div', 'lbl', '이번 달 업무 사용 비율' + (m.ym ? ' (' + m.ym + ')' : '')));
    ratio.appendChild(el('div', 'big', pct(m.ratioPct)));
    ratio.appendChild(el('div', 'lbl', '올해 ' + pct(y.ratioPct) + ' · 총 ' + km(y.totalKm) + ' km'));
    var stats = el('div', 'stats');
    [['총 주행', km(m.totalKm) + ' km'], ['업무용 합계 (출퇴근 포함)', km(m.businessKm) + ' km'], ['출퇴근', km(m.commuteKm) + ' km'], ['일반 업무', km(m.generalBusinessKm) + ' km'],
     ['미분류', m.unclassifiedCount + '건']].forEach(function (s) {
      var box = el('div', 'stat');
      box.appendChild(el('span', 'lbl', s[0]));
      box.appendChild(el('b', '', s[1]));
      stats.appendChild(box);
    });
    band.appendChild(ratio);
    band.appendChild(stats);
    sec.appendChild(band);
    if (car.fuelReimbursement) sec.appendChild(el('div', 'fuel', car.fuelReimbursement.text));   // an own car used for work

    if (car.archives.length) {
      sec.appendChild(el('div', 'sect', '운행기록부 보관함'));
      var files = el('div', 'files');
      car.archives.forEach(function (x) {
        var row = el('div');
        if (x.url.indexOf('/archives/') === 0) {
          var a = el('a', '', x.fileName);
          a.href = x.url;
          a.setAttribute('download', '');
          row.appendChild(a);
        } else {
          row.appendChild(el('span', '', x.fileName));
        }
        row.appendChild(el('small', '', [x.periodStart + ' ~ ' + x.periodEnd, '검증 코드 ' + x.verificationCode].join(' · ')));
        files.appendChild(row);
      });
      sec.appendChild(files);
    }

    sec.appendChild(el('div', 'sect', '최근 운행 (최신순, 최대 30건)'));
    var box = el('div', 'tablebox');
    box.dataset.key = car.key;
    if (!car.recentTrips.length) {
      box.appendChild(el('div', 'none', '아직 운행 기록이 없습니다.'));
    } else {
      var table = el('table'), hr = el('tr'), body = el('tbody');
      var tampered = tamperedTrips(car);
      HEAD.forEach(function (h) { hr.appendChild(el('th', '', h)); });
      table.appendChild(el('thead')).appendChild(hr);
      car.recentTrips.forEach(function (t) { body.appendChild(tripRow(car, t, now, known, tampered)); });
      table.appendChild(body);
      box.appendChild(table);
    }
    sec.appendChild(box);
    return sec;
  }

  function render(state) {
    var main = document.getElementById('fleet'), now = Date.now(), known = {};
    [].forEach.call(main.querySelectorAll('.tablebox'), function (b) { scrolls[b.dataset.key] = b.scrollLeft; });
    main.textContent = '';
    main.className = state.cars.length > 1 ? 'multi' : '';
    if (!state.cars.length) main.appendChild(el('div', 'empty', EMPTY));
    state.cars.forEach(function (car) {
      var sec = carView(car, now, known);
      main.appendChild(sec);
      var b = sec.querySelector('.tablebox');
      if (b && scrolls[car.key]) b.scrollLeft = scrolls[car.key];
    });
    Object.keys(born).forEach(function (s) { if (!known[s]) delete born[s]; });   // keep the map bounded
    seen = known;
    firstRender = false;
  }

  function setConn(ok, stamp) {
    var c = document.getElementById('conn');
    c.className = ok ? '' : 'off';
    c.textContent = ok ? '연결됨 · 마지막 갱신 ' + String(stamp).slice(11, 19) : '서버에 연결할 수 없습니다 · 다시 시도 중';
  }

  function tick() {
    if (busy) return;
    busy = true;
    fetch('/api/state', {cache: 'no-store'})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (state) {
        var json = JSON.stringify(state.cars);
        if (json !== lastJson) { lastJson = json; render(state); }   // identical data: leave the DOM (and scroll) alone
        setConn(true, state.generatedAt);
      })
      .catch(function () { setConn(false); })
      .then(function () { busy = false; });
  }
  setInterval(tick, POLL_MS);
  tick();
})();
</script>
</body>
</html>
